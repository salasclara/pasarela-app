name: Pasarela App - Validación de Story editorial
on:
  pull_request:
    paths:
      - 'app/(tabs)/imagen.tsx'
      - 'app/(tabs)/materializar.tsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/story-preview-check.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Comprobar TypeScript
        run: npx tsc --noEmit
      - name: Comprobar ESLint
        run: npx eslint 'app/(tabs)/imagen.tsx'
